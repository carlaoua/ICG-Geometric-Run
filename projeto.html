<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Geometric Run</title>
  <style>
    * { margin: 0; padding: 0; }
    body { overflow: hidden; background: #000; }

    #hint {
      position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,0.7); font: 13px/1 sans-serif;
      background: rgba(0,0,0,0.5); padding: 8px 16px; border-radius: 8px;
      pointer-events: none;
      display: none; 
    }

    /* ── MENU DE PAUSA ── */
    #pause-menu {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      flex-direction: column; align-items: center; justify-content: center; gap: 16px;
      background: rgba(255,255,255,0.08);
      backdrop-filter: blur(20px);
    }
    #pause-menu h1 { color: #fff; font: bold 42px sans-serif; }
    .pause-btn {
      width: 220px; padding: 14px; border-radius: 12px;
      font: bold 16px sans-serif; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.12); color: #fff;
      transition: background 0.2s, transform 0.15s;
    }
    .pause-btn:hover  { background: rgba(255,255,255,0.22); transform: scale(1.04); }
    #btn-restart { border-color: rgba(255,100,100,0.4); }

    /* ── MENU DE PERSONALIZAÇÃO (ecrã inicial) ── */
    #char-menu {
      display: flex;
      position: fixed; inset: 0; z-index: 60;
      flex-direction: column; align-items: center; 
      padding-top: 30px;
    }
    #char-menu h1 {
      color: #fff; font: bold 48px sans-serif;
      margin-bottom: 4px; letter-spacing: 4px; text-shadow: 0 2px 16px #000a;
    }
    #char-menu h3 {
      color: #fff; font: 32px sans-serif;
      margin-bottom: 8px; letter-spacing: 2px; text-shadow: 0 2px 12px #000a;
    }
    #btn-play {
      margin-top: 22px;
      width: 260px; padding: 16px; border-radius: 14px;
      font: bold 18px sans-serif; cursor: pointer;
      border: 1px solid rgba(255,255,255,0.3);
      background: rgba(34,180,100,0.85); color: #fff;
      transition: background 0.2s, transform 0.15s;
      box-shadow: 0 4px 24px rgba(34,180,100,0.4);
    }
    #btn-play:hover { background: rgba(34,200,110,1); transform: scale(1.04); }

    #controls-box {
      position: absolute;
      left: 40px;
      top: 50%;
      transform: translateY(-50%);
      width: 240px;
      padding: 18px 20px;
      border-radius: 14px;
      background: rgba(0,0,0,0.28);
      border: 1px solid rgba(255,255,255,0.18);
      box-shadow: 0 8px 30px rgba(0,0,0,0.25);
      backdrop-filter: blur(12px);
      color: #fff;
    }

    #controls-box h2 {
      margin-bottom: 12px;
      font: bold 20px sans-serif;
    }

    #controls-box p {
      margin: 6px 0;
      font: 14px/1.35 sans-serif;
      color: rgba(255,255,255,0.9);
    }
  </style>

  <script type="importmap">
  {
    "imports": {
      "three": "https://unpkg.com/three@0.158.0/build/three.module.js",
      "lil-gui": "https://cdn.jsdelivr.net/npm/lil-gui@0.19/+esm"
    }
  }
  </script>
</head>
<body>

<!-- ── MENU DE PERSONALIZAÇÃO (aparece primeiro) ── -->
<div id="char-menu">
  <h1>GEOMETRIC RUN</h1>
  <h3>✏️ Personalizar Personagem</h3>
  <button id="btn-play">▶ Jogar!</button>
</div>

<!-- ── MENU DE PAUSA ── -->
<div id="pause-menu">
  <h1>⏸ PAUSA</h1>
  <div style="display:flex; flex-direction:column; align-items:center; gap:6px;">
    <label style="color:#fff; font: 14px sans-serif;">
      🖱️ Sensibilidade: <span id="sens-val">5</span>
    </label>
    <input type="range" id="sens-slider"
      min="1" max="10" step="1" value="5"
      autocomplete="off"
      style="width:220px; accent-color:#88aaff;">
  </div>
  <button class="pause-btn" id="btn-resume">▶ Retomar</button>
  <button class="pause-btn" id="btn-daynight">🌙 Modo noite</button>
  <button class="pause-btn" id="btn-restart">↺ Reiniciar</button>

  <!-- ── MENU DOS COMANDOS ── -->
  <div id="controls-box">
    <h2>Instruções</h2>
    <p><strong>W A S D</strong> — mover</p>
    <p><strong>Shift</strong> — correr</p>
    <p><strong>Espaço</strong> — saltar</p>
    <p><strong>F</strong> — lanterna</p>
    <p><strong>Rato</strong> — mover câmara</p>
    <p><strong>Scroll</strong> — zoom</p>
    <p><strong>ESC</strong> — pausa</p>
    <p>Clicar em Reiniciar para voltar ao ultimo checkpoint</p>
  </div>
</div>

<div id="hint">Clica para capturar o rato · WASD movem · Shift corre · Espaço salta</div>

<script type="module">
  import * as THREE from 'three';

  // ── CONSTANTES ───────────────────────────────────────────────
  const GRAVITY     = -20;

  const MOVE_SPEED  =  5;
  const RUN_SPEED   =  8;
  const CAM_HEIGHT  =  2.5;
  const CAM_LERP    =  0.7;
  let sensibilidade = 0.008;
  const STEP_HEIGHT =  0.6;

  // ── RENDERER ─────────────────────────────────────────────────
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  document.body.appendChild(renderer.domElement);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x87ceeb);

  const camera = new THREE.PerspectiveCamera(60, window.innerWidth / window.innerHeight, 0.1, 200);

  const ambient = new THREE.AmbientLight(0xffffff, 0.4);
  scene.add(ambient);

  const sun = new THREE.DirectionalLight(0xffffff, 1.5);
  sun.position.set(20, 150, 50);
  sun.castShadow = true;
  sun.shadow.mapSize.set(1024, 1024);
  sun.shadow.camera.left   = -30;
  sun.shadow.camera.right  =  30;
  sun.shadow.camera.top    =  35;
  sun.shadow.camera.bottom = -30;
  sun.shadow.camera.far    =  300;
  sun.shadow.camera.updateProjectionMatrix();
  scene.add(sun);
  scene.add(sun.target);

  // ── DIA / NOITE ────────────────────────────────────────────────
  let isNight = false;
  const btnDayNight = document.getElementById('btn-daynight');

  function setDayNight(night) {
    isNight = night;

    if (isNight) {
      scene.background = new THREE.Color(0x0b1020);

      ambient.color.set(0x8899bb);
      ambient.intensity = 0.10;

      sun.color.set(0xaaccff);
      sun.intensity = 0.25;

      torchLight.intensity = torchOn ? 18 : 0;

      btnDayNight.textContent = '☀️ Modo dia';
    } else {
      scene.background = new THREE.Color(0x87ceeb);

      ambient.color.set(0xffffff);
      ambient.intensity = 0.4;

      sun.color.set(0xffffff);
      sun.intensity = 1.5;

      torchLight.intensity = torchOn ? 18 : 0;

      btnDayNight.textContent = '🌙 Modo noite';
    }

    for (const lamp of streetLamps) {
      if (isNight) {
        lamp.spot.visible = true;
        lamp.spot.intensity = 25;
        lamp.bulbMat.emissiveIntensity = 3;
      } else {
        lamp.spot.visible = false;
        lamp.spot.intensity = 0;
        lamp.bulbMat.emissiveIntensity = 0;
      }
    }
  }

  btnDayNight.addEventListener('click', () => {
    setDayNight(!isNight);
  });

  // ── CHÃO ─────────────────────────────────────────────────────
  const ground = new THREE.Mesh(
    new THREE.PlaneGeometry(150, 170),
    new THREE.MeshLambertMaterial({ color: 0x44aa44, 
      map: new THREE.TextureLoader().load('./grasslight-big.jpg', tex => {
        tex.wrapS = tex.wrapT = THREE.RepeatWrapping;
        tex.repeat.set(10, 10);}) })
  );
  ground.position.z = -80;
  ground.rotation.x = -Math.PI / 2;
  ground.receiveShadow = true;
  scene.add(ground);
  // ── PLATAFORMAS ───────────────────────────────────────────────
  const platforms = [];
  function addPlatform(x, y, z, w, d, h, colorOrMat) {
    const mesh = new THREE.Mesh(
      new THREE.BoxGeometry(w, h, d),
      colorOrMat instanceof THREE.Material ? colorOrMat 
      : new THREE.MeshLambertMaterial({ color: colorOrMat })
    );
    mesh.position.set(x, y, z);
    mesh.castShadow = true;
    mesh.receiveShadow = true;
    scene.add(mesh);
    const pData = {
      minX: x-w/2, maxX: x+w/2,
      minZ: z-d/2, maxZ: z+d/2,
      topY: y + h/2,
      baseY: y - h/2,
      hw: w/2, hd: d/2,  // ← guarda metade da largura/profundidade
      mesh: mesh
    };
    platforms.push(pData);
    return { mesh, pData };
  }
  function createAnimatedPlatform(x, y, z, w, d, h, color, moveFn, options = {}) {
    const { mesh, pData } = addPlatform(x, y, z, w, d, h, color);
    const { lookAtCenter, axis = 'z' } = options;

    return {
      pData,
      update(t, dt) {
        const oldX = pData.minX + pData.hw;
        const oldZ = pData.minZ + pData.hd;

        const { x: nx, y: ny, z: nz } = moveFn(t, dt);

        mesh.position.x = nx;
        mesh.position.z = nz;
        if (ny !== undefined) {
          mesh.position.y = ny;
          pData.topY  = ny + h / 2; 
          pData.baseY = ny - h / 2;
        }

        pData.minX = nx - pData.hw;  pData.maxX = nx + pData.hw;
        pData.minZ = nz - pData.hd;  pData.maxZ = nz + pData.hd;

        if (lookAtCenter) {
          const dx = nx - lookAtCenter.x;
          const dy = (ny ?? mesh.position.y) - lookAtCenter.y;
          const dz = nz - lookAtCenter.z;
          if (axis === 'z') mesh.rotation.z = -Math.atan2(dx, dy);
          if (axis === 'y') mesh.rotation.y = -Math.atan2(dx, dz);
          if (axis === 'x') mesh.rotation.x = -Math.atan2(dz, dy);
        }

        if (currentPlatform === pData) {
          pos.x += nx - oldX;
          pos.z += nz - oldZ;
        }
      }
    };
  }
  function createRisingPlatform(x, y, z, w, d, h, color, options = {}) {
    const {
      riseSpeed  = 3,
      fallSpeed  = 3,
      riseHeight = 8,
      reverse    = false  // ← true = desce ao detetar jogador
    } = options;

    let currentY  = y;
    let timeOnPlat = false;

    const plat = createAnimatedPlatform(x, y, z, w, d, h, color, (t, dt) => {
    const onTop = (currentPlatform === plat.pData);

      if (onTop) timeOnPlat = Math.min(timeOnPlat + dt, 1);
      else       timeOnPlat = 0;

      const triggered = onTop && (timeOnPlat >= 0.4);

      if (!reverse) {
        if (triggered) currentY = Math.min(currentY + riseSpeed * dt, y + riseHeight);
        else           currentY = Math.max(currentY - fallSpeed * dt, y);
      } else {
        if (triggered) currentY = Math.max(currentY - fallSpeed * dt, y - riseHeight);
        else           currentY = Math.min(currentY + riseSpeed * dt, y);
      }

      return { x, y: currentY, z };
    });

    return plat;
  }
  // ── CENÁRIO E TEXTURAS ─────────────────────────────────────────────
  const streetLamps = [];
  function addStreetLamp(x, y, z, rotY=0) {
    const lamp = new THREE.Group();

    const armLength = 2.5;
    // Poste
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.12, 0.16, poleHeight, 12),
      matPole
    );
    pole.position.y = poleHeight / 2;
    pole.castShadow = true;
    lamp.add(pole);
    // Braço
    const arm = new THREE.Mesh(
      new THREE.BoxGeometry(armLength, 0.08, 0.08),
      matPole
    );
    arm.position.set(armLength / 2 - 0.05, poleHeight - 0.45, 0);
    arm.castShadow = true;
    lamp.add(arm);
    // Cabeça da luz
    const head = new THREE.Mesh(
      new THREE.CylinderGeometry(0.16, 0.22, 0.35, 12),
      matHead
    );
    head.position.set(armLength - 0.15, poleHeight - 0.65, 0);
    head.castShadow = true;
    lamp.add(head);
    // Luz
    const spot = new THREE.SpotLight(0xffd46b, 25, 25, Math.PI / 8, 0.35, 2);
    spot.position.set(armLength - 0.15, poleHeight - 0.8, 0);
    spot.castShadow = true;
    spot.shadow.mapSize.set(1024, 1024);

    const bulbMat = new THREE.MeshStandardMaterial({
      color: 0xffe7a0,
      emissive: 0xffcc55,
      emissiveIntensity: 3
    });

    const bulb = new THREE.Mesh(
      new THREE.SphereGeometry(0.09, 20, 20),
      bulbMat
    );
    bulb.position.set(armLength - 0.14, poleHeight - 0.82, 0);
    lamp.add(bulb);

    const target = new THREE.Object3D();
    target.position.set(2, -5.1, 0); 
    lamp.add(target);
    spot.target = target;

    lamp.add(spot);
    lamp.position.set(x, y, z);
    lamp.rotation.y = rotY;
    scene.add(lamp);

    streetLamps.push({ spot, bulbMat });
  }
  const matTower = new THREE.MeshLambertMaterial({ map: new THREE.TextureLoader().load('./stone.jpg', stonetex => {
    stonetex.wrapS = stonetex.wrapT = THREE.RepeatWrapping;
    stonetex.repeat.set( 2, 2 );}) 
  });

    stonetex.repeat.set( 17, 2 );}) 
  });
  function addTower(cx, cz) {

    addPlatform(cx-10, 32, cz,   4, 4, 4, matTower);
    addPlatform(cx+10, 32, cz,   4, 4, 4, matTower);
  }
  const white  = 0xffffff;

  //(esquerda/direita, y, frente/trás, esticar, esticar, altura, cor/textura)

  // ─── AZUL ───────────────────────────────────────────────

  );
  const platA2 = createRisingPlatform(17, 57, -96, 4, 4, 0.5, azul_escuro,
    { reverse: true, riseSpeed: 3, fallSpeed: 3, riseHeight: 9 }
  );  
  addPlatform(24,  48, -96,  5, 5, 1,  azul_escuro);
  const platA3 = createRisingPlatform(24, 49, -90, 4, 4, 0.5, azul_claro,
    { riseSpeed: 3, fallSpeed: 3, riseHeight: 10 }
  );
  addPlatform(24,  59, -85,  5, 5, 1,  azul_escuro);
  const platA5 = createRisingPlatform(24, 70, -65, 4, 20, 0.5, azul_escuro,
    { reverse: true, riseSpeed: 3, fallSpeed: 1.6, riseHeight: 9 }
  );
  const platA4 = createRisingPlatform(24, 60, -79, 4, 4, 0.5, azul_claro,
    { riseSpeed: 3, fallSpeed: 3, riseHeight: 10 }
  );
  addPlatform(24,  67, -50,  5, 5, 1,  azul_claro);
  const platA6 = createRisingPlatform(24, 68, -44, 4, 4, 0.5, azul_claro,
    { riseSpeed: 3, fallSpeed: 3, riseHeight: 10 }
  );
  const platA7 = createRisingPlatform(7, 78, -44, 25, 4, 0.5, azul_escuro,
    { reverse: true, riseSpeed: 3, fallSpeed: 1.7, riseHeight: 9 }
  );
  const platA8 = createRisingPlatform(7, 78, -40, 25, 4, 0.5, azul_escuro,
    { reverse: true, riseSpeed: 3, fallSpeed: 1.7, riseHeight: 9 }
  );
  addPlatform(-10,  77, -44,  5, 5, 1,  azul_claro);

  const animatedPlatforms = [platP1, platP2, platP3, platP4, platP5, platP6, 
                            platA1, platA2,platA3, platA4, platA5, platA6, 
                            platA7, platA8];

  // ── CHECKPOINTS ───────────────────────────────────────────────
  function createFlag(x, y, z) {
    const group = new THREE.Group();

    // Mastro
    const pole = new THREE.Mesh(
      new THREE.CylinderGeometry(0.05, 0.05, 3, 8),
      new THREE.MeshLambertMaterial({ color: 0xaaaaaa })
    );
    pole.position.y = 1.5;   
    group.add(pole);

    // Bandeira (começa em baixo — scaleY = 0)
    const flag = new THREE.Mesh(
      new THREE.BoxGeometry(0.8, 0.5, 0.05),
      new THREE.MeshLambertMaterial({ color: 0xff2222})
    );
    flag.position.set(0.45, 0.25, 0);
    group.add(flag);

    group.position.set(x, y, z);
    scene.add(group);

    return { group, flag, collected: false, x, y, z, radius: 4 };
  }

  const checkpoints = [
    createFlag(-3,  20.5, -80),
    createFlag(-25, 37.5, -91),
    createFlag(-10, 77.5, -44),
  ];

  let checkpointState = null;

  function checkCheckpoints(dt) {
    for (const cp of checkpoints) {
      // Animar a subida da bandeira
      if (cp.collected && cp.flag.position.y < 2.75) {
        cp.flag.position.y = Math.min(cp.flag.position.y + dt * 2, 2.75);
      }

      if (cp.collected) continue;

      const dx = pos.x - cp.x;
      const dy = pos.y - cp.y;
      const dz = pos.z - cp.z;
      if (Math.sqrt(dx*dx + dy*dy + dz*dz) < cp.radius) {
        cp.collected = true;
        checkpointState = { x: cp.x, y: cp.y + 1, z: cp.z, angle, camAngle, camPitch, camDist };
      }
    }
  }
  // ── JOGADOR ───────────────────────────────────────────────────
  const playerGroup = new THREE.Group();
  scene.add(playerGroup);

  const matBody = new THREE.MeshLambertMaterial({ color: 0x2255ff });
  const matSkin = new THREE.MeshLambertMaterial({ color: 0xffcc88 });
  const matDark = new THREE.MeshLambertMaterial({ color: 0x112288 });
  const Dark = new THREE.MeshLambertMaterial({ color: 0x111111 });

  const body = new THREE.Mesh(new THREE.CylinderGeometry(0.3, 0.3, 0.9, 16), matBody);
  body.position.y = 0.9;
  body.castShadow = true; body.receiveShadow = true;
  playerGroup.add(body);

  const head = new THREE.Mesh(new THREE.SphereGeometry(0.28, 16, 16), matSkin);
  head.position.y = 1.65;
  head.castShadow = true; head.receiveShadow = true;
  playerGroup.add(head);

  const eye1 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), Dark);
  eye1.position.set(0.10, 1.66, -0.24);
  playerGroup.add(eye1);

  const eye2 = new THREE.Mesh(new THREE.SphereGeometry(0.06, 8, 8), Dark);
  eye2.position.set(-0.10, 1.66, -0.24);
  playerGroup.add(eye2);

  const pivotArmL = new THREE.Group();
  pivotArmL.position.set(-0.40, 1.3, 0);
  playerGroup.add(pivotArmL);
  const meshArmL = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.65, 8), matBody);
  meshArmL.position.y = -0.32;
  meshArmL.castShadow = true;
  pivotArmL.add(meshArmL);

  const pivotArmR = new THREE.Group();
  pivotArmR.position.set(0.40, 1.3, 0);
  playerGroup.add(pivotArmR);
  const meshArmR = new THREE.Mesh(new THREE.CylinderGeometry(0.07, 0.06, 0.65, 8), matBody);
  meshArmR.position.y = -0.32;
  meshArmR.castShadow = true;
  pivotArmR.add(meshArmR);

  const pivotLegL = new THREE.Group();
  pivotLegL.position.set(-0.15, 0.45, 0);
  playerGroup.add(pivotLegL);
  const meshLegL = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.5, 8), matDark);
  meshLegL.position.y = -0.2;
  meshLegL.castShadow = true;
  pivotLegL.add(meshLegL);

  const pivotLegR = new THREE.Group();
  pivotLegR.position.set(0.15, 0.45, 0);
  playerGroup.add(pivotLegR);
  const meshLegR = new THREE.Mesh(new THREE.CylinderGeometry(0.09, 0.09, 0.5, 8), matDark);
  meshLegR.position.y = -0.2;
  meshLegR.castShadow = true;
  pivotLegR.add(meshLegR);

  // ── ILUMINAÇÃO DO JOGADOR ─────────────────────────────────────
  const torchLight = new THREE.SpotLight(0xfff4cc, 0, 30, Math.PI / 9, 0.4, 1.5);
  torchLight.position.set(0, 1.5, 0);
  const torchTarget = new THREE.Object3D();
  torchTarget.position.set(0, 1, -2);
  playerGroup.add(torchTarget);
  torchLight.target = torchTarget;
  playerGroup.add(torchLight);

  let torchOn = false;

  setDayNight(false);

  // ── CÂMARA DE PREVIEW (usada no menu de personalização) ──────
  let previewAngle = 0;
  function updatePreviewCamera() {
    const dist = 4;
    camera.position.set(0, 1.5, -3.5);
    camera.lookAt(0, 1, 0);
  }

  // ── PERSONALIZAÇÃO (lil-gui) — 
  const params = {
    corCorpo:          '#2255ff',
    corPele:           '#ffcc88',
    corPernas:         '#112288',
    larguraCorpo:       1.0,
    tamanhoCaleca:      1.0,
    larguraBracos:  1.0,
    larguraPernas:  1.0,
  };

  const gui = new GUI({ title: '🎨 Personalizar', width: 250 });
  gui.domElement.style.setProperty('--background-color', 'rgba(10,10,20,0.95)');
  gui.domElement.style.setProperty('--title-background-color', '#4466aa');
  gui.domElement.style.setProperty('--text-color', '#ffffff');
  gui.domElement.style.setProperty('--number-color', '#66ffcc');
  gui.domElement.style.borderRadius = '12px';

  const pastaCore = gui.addFolder('Cores');
  pastaCore.addColor(params, 'corCorpo').name('Corpo').onChange(v => matBody.color.set(v));
  pastaCore.addColor(params, 'corPele').name('Pele').onChange(v => matSkin.color.set(v));
  pastaCore.addColor(params, 'corPernas').name('Pernas').onChange(v => matDark.color.set(v));

  const pastaProp = gui.addFolder('Proporções');
  pastaProp.add(params, 'larguraCorpo', 0.5, 2.0, 0.01).name('Largura corpo').onChange(v => {
    body.scale.x = v; body.scale.z = v;
  });
  pastaProp.add(params, 'tamanhoCaleca', 0.5, 1.8, 0.01).name('Cabeça').onChange(v => {
    head.scale.setScalar(v);
  });
  pastaProp.add(params, 'larguraBracos', 0.5, 3.0, 0.01).name('Largura braços').onChange(v => {
      meshArmL.scale.x = v; meshArmL.scale.z = v;
      meshArmR.scale.x = v; meshArmR.scale.z = v;
  });
  pastaProp.add(params, 'larguraPernas', 0.5, 3.0, 0.01).name('Largura pernas').onChange(v => {
      meshLegL.scale.x = v; meshLegL.scale.z = v;
      meshLegR.scale.x = v; meshLegR.scale.z = v;
  });

  gui.domElement.style.position = 'fixed';
  gui.domElement.style.top      = '50px';
  gui.domElement.style.left   = '8px';
  gui.domElement.style.zIndex   = '70'; 

  // ── ESTADO DO JOGO ────────────────────────────────────────────
  let gameStarted = false;

  // ── BOTÃO JOGAR — transição do menu para o jogo ───────────────
  document.getElementById('btn-play').addEventListener('click', () => {
    // 1. Esconde o menu de personalização
    document.getElementById('char-menu').style.display = 'none';
    // 2. Esconde o gui (pode ser reaberto via pausa se quiseres — aqui fechamos)
    gui.domElement.style.display = 'none';
    // 3. Mostra o hint do jogo
    document.getElementById('hint').style.display = 'block';
    // 4. Arranca o jogo
    gameStarted = true;
    clock.start();
    renderer.domElement.requestPointerLock();
  });

  // ── ESTADO DO JOGADOR ─────────────────────────────────────────
  const INITIAL_STATE = { x: 0, y: 0, z: 0, angle: 0, camAngle: 0, camPitch: 0.4, camDist: 5 };

  const pos     = new THREE.Vector3(INITIAL_STATE.x, INITIAL_STATE.y, INITIAL_STATE.z);
  let   velY    = 0;
  let   angle   = 0;
  let   onGround = true;

  // ── CÂMARA EM ÓRBITA (jogo) ───────────────────────────────────
  let camAngle = INITIAL_STATE.camAngle;
  let camPitch = INITIAL_STATE.camPitch;
  let camDist  = INITIAL_STATE.camDist;

  // ── RATO ──────────────────────────────────────────────────────
  let pointerLocked = false;
  let paused = false;
  const pauseMenu = document.getElementById('pause-menu');

  renderer.domElement.addEventListener('click', () => {
    if (gameStarted && !paused) renderer.domElement.requestPointerLock();
  });

  document.addEventListener('pointerlockchange', () => {
    const wasLocked = pointerLocked;
    pointerLocked = document.pointerLockElement === renderer.domElement;
    if (gameStarted && wasLocked && !pointerLocked && !paused) togglePause();
  });

  document.addEventListener('mousemove', e => {
    if (!gameStarted) return;
    if (!pointerLocked || paused) return;
    camAngle -= e.movementX * sensibilidade;
    camPitch += e.movementY * sensibilidade;
    camPitch = Math.max(0.05, Math.min(1.4, camPitch));
  });

  document.addEventListener('wheel', e => {
    if (!gameStarted || paused) return;
    camDist += e.deltaY * 0.01;
    camDist = Math.max(2, Math.min(15, camDist));
  });

  // ── INPUT ─────────────────────────────────────────────────────
  const keys = {};
  document.addEventListener('keydown', e => {
    if (e.code === 'Space') e.preventDefault();
    if (gameStarted && !paused) keys[e.code] = true;

      if (e.code === 'KeyF') {
        torchOn = !torchOn;
        torchLight.intensity = torchOn ? 18 : 0;
      }
  });
  document.addEventListener('keyup', e => { keys[e.code] = false; });

  // ── FÍSICA ────────────────────────────────────────────────────
  let currentPlatform = null; // plataforma onde o jogador está pousado

  function getFloorY(x, z) {
    let highest = 0;
    let highestP = null;
    for (const p of platforms) {
      if (x > p.minX && x < p.maxX && z > p.minZ && z < p.maxZ) {
        if (p.topY > highest && p.topY <= pos.y + STEP_HEIGHT && pos.y >= p.baseY) {
          highest = p.topY;
          highestP = p;
        }
      }
    }
    currentPlatform = highestP;
    return highest;
  }

  function collidesWithWall(x, z) {
    for (const p of platforms) {
      if (x > p.minX && x < p.maxX && z > p.minZ && z < p.maxZ) {
        if (p.topY > pos.y + STEP_HEIGHT && p.baseY < pos.y + 2) return true;
      }
    }
    return false;
  }

  // ── PAUSA ─────────────────────────────────────────────────────
  function togglePause() {
    paused = !paused;
    pauseMenu.style.display = paused ? 'flex' : 'none';
    if (!paused) renderer.domElement.requestPointerLock();
  }

  document.getElementById('btn-resume').addEventListener('click', togglePause);

  document.getElementById('btn-restart').addEventListener('click', () => {
    const spawnState = checkpointState ?? INITIAL_STATE;
    pos.set(spawnState.x, spawnState.y, spawnState.z);
    angle    = spawnState.angle;
    camAngle = spawnState.camAngle;
    camPitch = spawnState.camPitch;
    camDist  = spawnState.camDist;
    onGround = true;
    camPos.set(
      spawnState.x,
      spawnState.y + Math.sin(spawnState.camPitch) * spawnState.camDist,
      spawnState.z + Math.cos(spawnState.camAngle) * spawnState.camDist
    );
    for (const k in keys) keys[k] = false;
    togglePause();
  });

  document.getElementById('sens-slider').addEventListener('input', e => {
    const v = Number(e.target.value);
    sensibilidade = v * 0.0016;
    document.getElementById('sens-val').textContent = v;
  });

  // ── LOOP ──────────────────────────────────────────────────────
  const camPos = new THREE.Vector3(0, CAM_HEIGHT, camDist);
  const clock  = new THREE.Clock();
  const hint   = document.getElementById('hint');

  function animate() {
    requestAnimationFrame(animate);

    // ── MODO PREVIEW (menu de personalização ativo) ───────────
    if (!gameStarted) {
      updatePreviewCamera();
      const t = performance.now() * 0.002;
      pivotArmL.rotation.x =  Math.sin(t) * 0.15;
      pivotArmR.rotation.x = -Math.sin(t) * 0.15;
      head.position.y = 1.65 + Math.sin(t * 0.6) * 0.02;
      eye1.position.y = 1.65 + Math.sin(t * 0.6) * 0.02;
      eye2.position.y = 1.65 + Math.sin(t * 0.6) * 0.02;
      renderer.render(scene, camera);
      return;
    }

    // ── MODO JOGO ─────────────────────────────────────────────
    if (paused) { clock.getDelta(); return; }

    const dt = Math.min(clock.getDelta(), 0.05);

    const forward = new THREE.Vector3(-Math.sin(camAngle), 0, -Math.cos(camAngle));
    const right   = new THREE.Vector3( Math.cos(camAngle), 0, -Math.sin(camAngle));

    const moveDir = new THREE.Vector3();
    if (keys['KeyW']) moveDir.addScaledVector(forward,  1);
    if (keys['KeyS']) moveDir.addScaledVector(forward, -1);
    if (keys['KeyA']) moveDir.addScaledVector(right,   -1);
    if (keys['KeyD']) moveDir.addScaledVector(right,    1);

    const moving  = moveDir.lengthSq() > 0;
    const running = keys['ShiftLeft'] && moving;

    if (keys['Space'] && onGround) { velY = JUMP_VEL; onGround = false; }

    velY += GRAVITY * dt;
    pos.y += velY * dt;

    const floorY = getFloorY(pos.x, pos.z);
    if (pos.y <= floorY) { pos.y = floorY; velY = 0; onGround = true; }
    else { onGround = false; }

    checkCheckpoints(dt);

    if (moving) {
      moveDir.normalize();
      const speed = running ? RUN_SPEED : MOVE_SPEED;
      const step  = speed * dt;
      const newX  = pos.x + moveDir.x * step;
      if (!collidesWithWall(newX, pos.z)) pos.x = newX;
      const newZ  = pos.z + moveDir.z * step;
      if (!collidesWithWall(pos.x, newZ)) pos.z = newZ;

      const targetAngle = Math.atan2(-moveDir.x, -moveDir.z);
      let diff = targetAngle - angle;
      while (diff >  Math.PI) diff -= Math.PI * 2;
      while (diff < -Math.PI) diff += Math.PI * 2;
      angle += diff * 0.15;
    }
    // PLATAFORMAS ANIMADAS
    const elapsed = clock.getElapsedTime();
    for (const plat of animatedPlatforms) plat.update(elapsed, dt);

    // DISTANCE CULLING
    const CULL_DIST = 150; // distância máxima em unidades
    const CULL_DIST_SQ = CULL_DIST * CULL_DIST;
    for (const p of platforms) {
      const dx = ((p.minX + p.maxX) / 2) - pos.x;
      const dz = ((p.minZ + p.maxZ) / 2) - pos.z;
      p.mesh.visible = (dx * dx + dz * dz) < CULL_DIST_SQ;
    }

    playerGroup.position.copy(pos);
    playerGroup.rotation.y = angle;

    const animSpeed     = running ? 0.012 : 0.006;
    const animAmplitude = running ? 0.85  : 0.55;
    const t             = performance.now() * animSpeed;
    const swing         = moving ? Math.sin(t) * animAmplitude : 0;
    const swingDamp     = moving ? swing * 0.6 : 0;

    pivotArmL.rotation.x =  swing;
    pivotArmR.rotation.x = -swing;
    pivotLegL.rotation.x = -swingDamp;
    pivotLegR.rotation.x =  swingDamp;

    const desiredCam = new THREE.Vector3(
      pos.x + Math.sin(camAngle) * camDist * Math.cos(camPitch),
      pos.y + Math.sin(camPitch) * camDist,
      pos.z + Math.cos(camAngle) * camDist * Math.cos(camPitch)
    );
    camPos.lerp(desiredCam, CAM_LERP);
    camera.position.copy(camPos);
    camera.lookAt(pos.x, pos.y + 1, pos.z);

    sun.position.set(pos.x + 10, 150, pos.z + 10);
    sun.target.position.set(pos.x, pos.y, pos.z);
    sun.target.updateMatrixWorld();

    hint.textContent = pointerLocked
      ? 'ESC pausa · WASD movem · Shift corre · Rato câmara · Scroll zoom · Espaço salta'
      : 'Clica para capturar o rato';

    renderer.render(scene, camera);
  }

  animate();

  window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
  });
</script>
</body>
</html>
